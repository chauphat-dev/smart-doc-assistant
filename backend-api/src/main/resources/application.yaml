spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: backend-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartdoc}
    username: ${DB_USERNAME:smartdoc}
    password: ${DB_PASSWORD:smartdoc_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Cấu hình đường dẫn giao diện Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html