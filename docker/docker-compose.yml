services:
  postgres:
    image: postgres:18
    container_name: smartdoc_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartdoc
      - POSTGRES_USER=smartdoc
      - POSTGRES_PASSWORD=smartdoc_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: smartdoc_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # HTTP REST API & Web Dashboard
      - "127.0.0.1:6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: