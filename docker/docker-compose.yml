services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_16
    restart: always
    environment:
      - POSTGRES_DB=smartdoc
      - POSTGRES_USER=smartdoc
      - POSTGRES_PASSWORD=smartdoc_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
volumes:
  postgres_data:
  qdrant_storage: